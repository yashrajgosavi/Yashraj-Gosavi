<meta name="color-scheme" content="light">
<style>
  :root { --link: #1a4c8b; --desk: #e8e8e8; --paper: #fff; --bar: 56px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--desk); color: #000;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  a { color: var(--link); }

  .bar {
    height: var(--bar); flex: none; padding: 0 16px; background: var(--paper);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .bar strong { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; flex: none; }
  .btn {
    font: 600 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; text-decoration: none;
    color: #fff; background: var(--link); border-radius: 6px; padding: 10px 14px; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn.alt { color: var(--link); background: var(--paper); box-shadow: inset 0 0 0 1px var(--link); }

  .viewer { flex: 1; width: 100%; border: 0; display: block; }

  /* Shown instead of the viewer when the browser cannot display PDFs inline (most phones). */
  .fallback {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .card {
    background: var(--paper); border-radius: 10px; padding: 28px 24px; max-width: 420px; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  .card h1 { font-size: 22px; margin: 0 0 6px; }
  .card p { margin: 0 0 20px; color: #444; }
  .card .actions { justify-content: center; flex-wrap: wrap; }
  [hidden] { display: none !important; }

  @media (max-width: 480px) { .bar strong { display: none; } .bar { justify-content: flex-end; } }
</style>
</head>
<body>

<nav class="bar">
  <strong>Yashraj Gosavi — Resume</strong>
  <div class="actions">

    <a class="btn" href="Yashraj_Gosavi_Resume.pdf" download>Download PDF</a>

</nav>

<object id="viewer" class="viewer" data="Yashraj_Gosavi_Resume.pdf#view=FitH" type="application/pdf" aria-label="Resume PDF">

</object>

<div id="fallback" class="fallback" hidden>
  <div class="card">
    <h1>Yashraj Gosavi</h1>

    <div class="actions">

      <a class="btn alt" href="./">Web version</a>

</div>

<script>
  // Mobile browsers usually report no inline PDF viewer and show an empty box; offer the buttons instead.
  if (navigator.pdfViewerEnabled === false) {
    document.getElementById("viewer").remove();
    document.getElementById("fallback").hidden = false;
  }
</script>

</body>
